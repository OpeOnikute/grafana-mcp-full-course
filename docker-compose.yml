services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin12345

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    ports:
      - "8005:8000"
    env_file:
      - .env.cloud
    command: ["-t", "streamable-http", "--disable-write"]
    depends_on:
      - grafana